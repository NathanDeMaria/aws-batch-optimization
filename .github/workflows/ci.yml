# One check, `ci`, is what the branch ruleset requires. It covers the python
# package (batch-core); infra/ has its own terraform.yml, which plans on every
# branch but only runs when infra/ changes, so it can't be a required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded PR runs are pointless, but let pushes to main finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: batch-core
    env:
      # Inline annotations on the PR diff instead of plain console output
      RUFF_OUTPUT_FORMAT: github
      TY_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "batch-core/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: make check

      - name: Test
        run: make test
